# ─────────────────────────────────────────────
#  docker-compose.yml  →  DESARROLLO
#  Levanta: Django (runserver) + Vite (HMR)
#  El PostgreSQL vive en una red Docker externa
#
#  Uso:
#    docker network create mentor_net   # solo la primera vez
#    docker compose up --build
# ─────────────────────────────────────────────
services:

  # ── Django backend ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DEBUG: "True"
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    networks:
      - mentor_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy

  # ── React + Vite frontend ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - mentor_net

  # ── PostgreSQL ────────────────────────────── 
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-MentorVirtual}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
#      - ./backend/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    networks:
      - mentor_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:

networks:
  mentor_net:
    driver: bridge
