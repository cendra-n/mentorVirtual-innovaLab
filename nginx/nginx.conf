worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

    upstream django {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Redirigir todo a HTTPS en producción
        # Comentar estas dos líneas si no tenés SSL todavía
        # return 301 https://$host$request_uri;

        root /usr/share/nginx/html;
        index index.html;

        # ── API → Django ─────────────────────────
        location /api/ {
            proxy_pass         http://django;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Admin Django ──────────────────────────
        location /admin/ {
            proxy_pass         http://django;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Static files de Django ────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ── React SPA (todo lo demás) ─────────────
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── HTTPS (descomentar cuando tengas certs) ──
    # server {
    #     listen 443 ssl;
    #     server_name tudominio.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     ... (mismo contenido del server de arriba)
    # }
}
